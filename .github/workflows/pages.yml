name: Publish share page (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push site/ to gh-pages branch
        run: |
          cd site
          git init -q && git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "site ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Check that the page is live
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          gh api repos/${{ github.repository }}/pages > pages_api.json 2>&1 || true
          sleep 60
          curl -s -o /dev/null -w "root %{http_code}\n" https://perunov84-gif.github.io/shopping-list/ > live.txt
          curl -s -o /dev/null -w "share %{http_code}\n" https://perunov84-gif.github.io/shopping-list/s/ >> live.txt
          git init -q && git checkout -q -b logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "pages check" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" logs:ci-logs-pages
