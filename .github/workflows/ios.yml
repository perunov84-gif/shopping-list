name: iOS build check

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS (no codesign)
        run: |
          set -o pipefail
          mkdir -p /tmp/ci
          flutter pub get
          flutter build ios --release --no-codesign --dart-define=STORE=gplay 2>&1 | tee /tmp/ci/build_ios.log
      - name: Push logs
        if: always()
        run: |
          cd /tmp/ci
          git init -q && git checkout -q -b logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "${{ github.sha }} run ${{ github.run_number }} ${{ job.status }}" > STATUS.txt
          git add -A && git commit -qm "ios logs ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" logs:ci-logs-ios
