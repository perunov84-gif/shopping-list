name: shopping_list
description: "Список покупок — быстрые списки по магазинам с умными подсказками."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  speech_to_text: ^7.5.0
  share_plus: ^13.3.1
  # Реклама: AdMob (Google Play / App Store) и Яндекс (RuStore)
  google_mobile_ads: ^9.2.0
  yandex_mobileads: ^8.6.0
  # Покупки: Google Play Billing / StoreKit
  in_app_purchase: ^3.3.1
  # Резервная копия: выбор файла для импорта
  file_picker: any
  # Покупки: RuStore Pay SDK
  flutter_rustore_pay: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/catalog.json
